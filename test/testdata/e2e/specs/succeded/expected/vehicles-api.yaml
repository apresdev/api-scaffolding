components:
  parameters:
    LimitParameter:
      in: query
      name: limit
      description: |
        An optional query parameter used to indicate the number of records in a pagination result.  

        For example please list the "limit" records after the given optional "offset" position.
      required: false
      schema:
        $ref: "#/components/schemas/Limit"
    OffsetParameter:
      in: query
      name: offset
      description: |
        An optional query parameter used to indicate the offset position to resume from in a pagination result. 

        For example please list the "limit" records after the given optional "offset" position.
      required: false
      schema:
        $ref: "#/components/schemas/Offset"
    QueryIdParameter:
      in: path
      name: queryId
      required: true
      schema:
        $ref: "#/components/schemas/QueryIdentifier"
      example: territory.contacts.trend
    VehicleIdParameter:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VehicleIdentifier"
    ManufacturerIdParameter:
      name: manufacturerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ManufacturerIdentifier"
    ModelIdParameter:
      name: modelId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModelIdentifier"
    PhotoIdParameter:
      name: photoId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PhotoIdentifier"
  requestBodies:
    ExecuteQueryRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecuteQueryRequest"
    ListVehiclesRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListVehiclesRequest"
    ListVehiclesByYearRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListVehiclesByYearRequest"
    RetrieveVehicleByLicenseRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RetrieveVehicleByLicenseRequest"
    SearchManufacturersRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchManufacturersRequest"
    SearchModelsRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchModelsRequest"
    SearchVehiclesRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchVehiclesRequest"
    CreateVehiclePhotoRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadUrlRequest"
    UpdateVehiclePhotoRequest:
      description: On success
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadUrlRequest"
    CreateVehicleRequest:
      description: The new vehicle
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehicleInput"
    UpdateVehicleRequest:
      description: The new vehicle
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehicleInput"
    CreateModelRequest:
      description: The new model
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelInput"
    UpdateModelRequest:
      description: The new model
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelInput"
    CreateManufacturerRequest:
      description: The new manufacturer
