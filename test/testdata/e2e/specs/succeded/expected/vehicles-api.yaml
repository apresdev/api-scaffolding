    UpdateManufacturerRequest:
      description: The new manufacturer
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManufacturerInput"
  responses:
    NoContent:
      description: |
        The request completed successfully.  No response body will be sent.
    ExecuteQueryResponse:
      description: A response containing the results of the query
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecuteQueryResponse"
          examples:
            total-by-manufacturer:
              value:
                status: success
                metadata:
                  total: 2
                  offset: 0
                  columns:
                    - name: model.id
                      columnType: dimension
                      dataType:
                        type: string
                        format: uuid
                      sortable: false
                    - name: model.name
                      columnType: dimension
                      dataType:
                        type: string
                      sortable: false
                    - name: model.manufacturer.id
                      columnType: dimension
                      dataType:
                        type: string
                        format: uuid
                      sortable: false
                    - name: model.manufacturer.name
                      columnType: dimension
                      dataType:
                        type: string
                      sortable: false
                    - name: total
                      columnType: measure
                      dataType:
                        type: integer
                      sortable: false
                data:
                  - - f9bcb624-e65a-4e64-aae0-564dbc976506
                    - Kona
                    - f9bcb624-e65a-4e64-aae0-564dbc976506
