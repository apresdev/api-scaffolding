  securitySchemes:
    oauth2:
      type: oauth2
      description: This API uses OAuth 2 with the implicit grant flow. [More info](https://api.example.com/docs/auth)
      flows:
        authorizationCode:
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes: {}
    cognito:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - ${cognito_provider_arn}
  schemas:
    ApiStatus:
      type: string
      enum:
        - success
        - failure
    QueryIdentifier:
      type: string
    ExecuteQueryRequest:
      type: object
      properties:
        filterBy:
          type: object
          additionalProperties: {}
        orderBy:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                $ref: "#/components/schemas/SortDirection"
        limit:
          $ref: "#/components/schemas/Limit"
        offset:
          $ref: "#/components/schemas/Offset"
    FileIdentifier:
      type: string
      example: image.png
    Length:
      type: integer
      minimum: 0
    MD5Checksum:
      type: string
      format: byte
      minLength: 24
      maxLength: 24
      description: >
        The MD5 message-digest algorithm is a widely used hash function producing a 128-bit hash value, represented as 24 base64 characters.
        digits.
      example: 4/xQqI0KNkMT30sh7yDCng==
    ContentType:
      type: string
      description: >
        A MIME type (now properly called "media type", but also sometimes "content type") is a string sent along with a file indicating the
        type of the file (describing the content format, for example, a sound file might be labeled audio/ogg, or an image file image/png).
      example: image/png
    UploadUrlRequest:
      description: |
        Contains directives specifying aspects of the file that is requesting to be uploaded.
      type: object
      required:
        - contentType
        - md5
      properties:
        contentType:
          $ref: "#/components/schemas/ContentType"
        contentLength:
          $ref: "#/components/schemas/Length"
        contentMD5:
          $ref: "#/components/schemas/MD5Checksum"
    UploadUrlResponse:
      description: >
        Contains the directives as to how to upload the file.  Sent in response to an API to request a file upload. Describes the HTTP
        method (PUT or POST) and URL where the file contents should be sent.   The file contents should be sent as raw binary data.
      type: object
      required:
        - id
        - method
        - url
      properties:
        id:
          $ref: "#/components/schemas/FileIdentifier"
        method:
          type: string
          default: PUT
          enum:
            - POST
            - PUT
          example: PUT
        url:
          type: string
          format: uri
          example: http://example/com/upload
    Metadata:
      type: object
      properties:
        total:
          type: number
          description: |
            Returned in a paginated result set.  Indicates the total number of records in the given result set.
          example: 1
    SortDirection:
      type: string
      enum:
        - asc
        - desc
    Limit:
      type: integer
      minimum: 0
    Offset:
      type: integer
      minimum: 0
    DateTimeFilter:
      type: object
      description: >
        A filter used to filter results based on a given `date-time` field.

        Specific filters allow the client to search between a starting and ending date-time range, before a given date-time, at a specific
        date-time, and after a given date-time.

        Relative filters allow the client to search the past X chrono units (e.g. past 30 days), the next X chrono units (e.g. the next 7
        days), or within the current chrono unit (e.g. in the current month or year).
      properties:
        between:
          $ref: "#/components/schemas/DateTimeRange"
        before:
          type: string
          format: date-time
        at:
          type: string
          format: date-time
        after:
          type: string
          format: date-time
        past:
          $ref: "#/components/schemas/RelativeRange"
        next:
          $ref: "#/components/schemas/RelativeRange"
        current:
          $ref: "#/components/schemas/ChronoUnit"
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      example:
        next:
          duration: 1
          unit: week
    DateTimeRange:
      type: object
      description: |
        A fixed date-time range, represented by a start date-time and an end date-time.
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    RelativeRange:
      type: object
      description: |
        A relative range.  Used to represent a range of date/time values relative to the current date and time.
      required:
        - duration
        - unit
      properties:
        duration:
          type: integer
          description: >
            The number of chronological units to include in the range.  For example the next 30 days would have `duration: 30` and `unit:
            day`
        unit:
          $ref: "#/components/schemas/ChronoUnit"
        inclusive:
          type: boolean
          default: true
          description: >
            A flag to indicate if the relative range should commmence relative to the current date-time, or if it should start on the next
            logical chronological boundary. For example, next month, could be the next 30-ish days starting from now (inclusive: true) or it
            could be the full range of days in the next month, starting on the first of the month
    ChronoUnit:
      type: string
      description: |
        A standard set of date periods units. This set of units provide unit-based access to manipulate a date, time or date-time.
      enum:
        - day
        - week
        - month
        - year
    ValueType:
      description: The data type of the values
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - string
            - integer
            - number
            - boolean
            - object
            - array
        format:
          type: string
        items:
          $ref: "#/components/schemas/ValueType"
        properties:
          additionalProperties:
            $ref: "#/components/schemas/ValueType"
    ColumnType:
      description: |
        The role of the column in the results
          * attribute: column from a simple projection
          * dimension: column from an aggregation query used in the 'group by' clause
          * measure: column aggregated in an aggregation query
          * constant: a constant value
          * document: column with the full JSON payload of the record
      type: string
      enum:
