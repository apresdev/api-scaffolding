asyncapi: 3.0.0
info:
  title: ClearSight Health Asynchronous asyncapi
  version: 2.0.0
servers: 
  production:
    host: wss://clearsighthealth.io/asyncapi
    description: Public server used to send push notifications to authorize clients.
    protocol: wss
    bindings:
      ws:
        method: GET

channels:
  notifications-{userId}:
    address: notifications 
    messages:
      ping:
        $ref: "#/components/messages/ping"
      pong:
        $ref: "#/components/messages/pong"
      reminder:
        $ref: "#/components/messages/reminder"
      chat-message:
        $ref: "#/components/messages/chat-message"
    servers:
      - $ref: "#/servers/production"
    parameters:
      userId:
        $ref: "#/components/parameters/UserIdentifier"

operations:
  onReminderDue:
    action: receive
    channel:
      $ref: "#/channels/notifications"
    messages:
      - $ref: "#/channels/notifications/messages/reminder"

  onChatMessage:
    action: receive
    channel:
      $ref: "#/channels/notifications"
    messages:
      - $ref: "#/channels/notifications/messages/chat-message"

  ping:
    action: send
    description: >
      Sent by the client periodically as a keep-alive on the socket.
    channel:
      $ref: "#/channels/notifications"
    messages:
      - $ref: "#/channels/notifications/messages/ping"
  pong:
    action: receive
    description: >
      Sent by the service in response to a periodic keep-alive ping message.
    channel:
      $ref: "#/channels/notifications"
    messages:
      - $ref: "#/channels/notifications/messages/pong"

components:
  parameters:
    UserIdentifier:
      description: Id of the user.

  messages:

    ping:
      name: ping
      payload:
        schema:
          type: object
          properties: 
            event:
              const: "ping"
            data:
              type: object
    pong:
      name: pong
      payload:
        schema:
          type: object
          properties: 
            event:
              const: "pong"
            data:
              type: object


    reminder:
      name: reminder
      payload:
        schema:
          $ref: "#/components/schemas/ReminderEvent"

    chat-message:
      name: chat-message
      payload:
        schema:
          $ref: "#/components/schemas/ChatMessageEvent"

  schemas:
    EntityIdentifier:
      type: string
      format: uuid

    NPI:
      type: string
      description: >
        A national provide identifier. 

        A National Provider Identifier (NPI) is a unique 10-digit identification number issued to health care providers  in the United States by
        the Centers for Medicare and Medicaid Services (CMS). The NPI has replaced the Unique  Physician Identification Number (UPIN) as the
        required identifier for Medicare services, and is used by other  payers, including commercial healthcare insurers. The transition to the
        NPI was mandated as part of the  Administrative Simplifications portion of the Health Insurance Portability and Accountability Act of 1996
        (HIPAA).[1]


        See also: https://en.wikipedia.org/wiki/National_Provider_Identifier
      maxLength: 10
      minLength: 10
      pattern: \d{10}
      example: "5734197562"

    PhysicianIdentifier:
      $ref: "#/components/schemas/NPI"

    ReminderEvent:
      type: object
      properties:
        type:
          const: "reminder"
        message:
          type: string
          examples:
            - "Meet at the golf course at noon."
        data:
          type: object
          properties:           
            id:
              $ref: "#/components/schemas/PhysicianIdentifier"
            name:
              type: string
            image:
              type: string
              format: uri
              
    ChatMessageEvent:
      type: object
      properties:
        type:
          const: "chat-message"
        message:
          type: string
          examples:
            - "Are we still on for lunch today?"
        data:
          type: object
          properties:           
            id:
              $ref: "#/components/schemas/PhysicianIdentifier"
            name:
              type: string
            image:
              type: string
              format: uri
                            