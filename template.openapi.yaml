openapi: 3.0.3
info:
  title: "TODO: Insert title"
  version: 0.0.0

tags:
  - name: Query
    description: Query operations.

servers: []

paths:
  "/queries/{queryId}":
    post:
      operationId: executeQuery
      description: >
        Executes a named query.
      tags:
        - Query
      parameters:
        - $ref: "#/components/parameters/QueryIdParameter"
      requestBody:
        $ref: "#/components/requestBodies/ExecuteQueryRequest"
      responses:
        200:
          $ref: "#/components/responses/ExecuteQueryResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
      x-apres-known-queries: {}

components:
  parameters:
    VersionParameter:
      in: path
      name: version
      required: true
      schema:
        $ref: "#/components/schemas/DataVersion"

    LimitParameter:
      in: query
      name: limit
      description: >
        An optional query parameter used to indicate the number of records in a pagination result.  


        For example please list the "limit" records after the given optional "offset" position.
      required: false
      schema:
        $ref: "#/components/schemas/Limit"

    OffsetParameter:
      in: query
      name: offset
      description: >
        An optional query parameter used to indicate the offset position to resume from in a pagination result. 


        For example please list the "limit" records after the given optional "offset" position.
      required: false
      schema:
        $ref: "#/components/schemas/Offset"

    QueryIdParameter:
      in: path
      name: queryId
      required: true
      schema:
        $ref: "#/components/schemas/QueryIdentifier"
      example: territory.contacts.trend

  requestBodies:
    ExecuteQueryRequest:
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ExecuteQueryRequest"

  responses:
    # ##################################################################################################################
    # Common Success Modes
    # ##################################################################################################################
    NoContent:
      description: >
        The request completed successfully.  No response body will be sent.

    ExecuteQueryResponse:
      description: A response containing the results of the query
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecuteQueryResponse"
          examples: {}

    # ##################################################################################################################
    # Failure Modes
    # ##################################################################################################################
    # 400 Bad Request
    BadRequest:
      description: >
        An error occurred.  The client provided one or more invalid inputs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: bad_request
                  description: The supplied value was invalid.
                  path: request

    # 401 Unauthorized
    Unauthorized:
      description: >
        An error occurred.  The client is not authenticated in the system.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: unauthorized
                  description: The client should authenticate itself to get the requested response.

    # 403 Forbidden
    Forbidden:
      description: >
        An error occurred.  The client is not authorized to perform the requested action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: forbidden
                  description: The client does not have the access right for the content.

    # 404 Not Found
    NotFound:
      description: >
        An error occurred.  The client requested a resource that does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: not_found
                  description: Could not find to requested resource.

    # 409 Conflict
    Conflict:
      description: >
        An error occurred.  Indicates a request conflict with the current state of the target resource.


        The primary use case for the 409 Conflict is to signal that a sync collection is too far out of date with the  current server
        state.  As such, the client should truncate the current local state and should restart the  checkpoint iteration from the beginning
        of time (i.e. start with an empty sync anchor).  This is useful for the  OLAP view sync collections that can add or remove
        reseources, without deleting the resources, simply by  modifying the WHERE clause of the view.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: conflict
                  description: The request conflicts with the current state of the target resource.

    # 412 Conflict
    PreConditionsFailed:
      description: >
        An error occurred.  Indicates a request conflict with the current state of the target resource.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: preconditions_failed
                  description: The request failed due to a pre-conditions check. Possible merge conflict detected.

    # 500 Internal Server Error
    InternalServerError:
      description: >
        An unexexpected error occurred during the request.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            status: failure
            data:
              errors:
                - message: server_error
                  description: An error occurred while processing the request.

  securitySchemes:
    oauth2:
      type: oauth2
      description: This API uses OAuth 2 with the implicit grant flow. [More info](https://api.example.com/docs/auth)
      flows:
        authorizationCode: # <---- OAuth flow(authorizationCode, implicit, password or clientCredentials)
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes: {}

    cognito:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - ${cognito_provider_arn}

  schemas:
    # ##################################################################################################################
    # Standard Common Domain Objects
    # ##################################################################################################################
    ApiStatus:
      type: string
      enum: [success, failure]

    DataVersion:
      type: number
      minimum: 1

    CommitMessage:
      type: string
      minLength: 1

    QueryIdentifier:
      type: string

    ExecuteQueryRequest:
      type: object
      properties:
        filterBy:
          type: object
          additionalProperties: {}
        orderBy:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                $ref: "#/components/schemas/SortDirection"
        limit:
          $ref: "#/components/schemas/Limit"
        offset:
          $ref: "#/components/schemas/Offset"

    FileIdentifier:
      type: string
      example: image.png

    Length:
      type: integer
      minimum: 0

    MD5Checksum:
      type: string
      format: byte
      minLength: 24
      maxLength: 24
      description: >
        The MD5 message-digest algorithm is a widely used hash function producing a 128-bit hash value, represented as 24 base64 characters.
        digits.
      example: 4/xQqI0KNkMT30sh7yDCng==

    ContentType:
      type: string
      description: >
        A MIME type (now properly called "media type", but also sometimes "content type") is a string sent along with a file indicating the
        type of the file (describing the content format, for example, a sound file might be labeled audio/ogg, or an image file image/png).
      example: image/png

    UploadUrlRequest:
      description: >
        Contains directives specifying aspects of the file that is requesting to be uploaded.
      type: object
      required: [contentType, md5]
      properties:
        contentType:
          $ref: "#/components/schemas/ContentType"
        contentLength:
          $ref: "#/components/schemas/Length"
        contentMD5:
          $ref: "#/components/schemas/MD5Checksum"

    UploadUrlResponse:
      description: >
        Contains the directives as to how to upload the file.  Sent in response to an API to request a file upload. Describes the HTTP
        method (PUT or POST) and URL where the file contents should be sent.  
        The file contents should be sent as raw binary data.
      type: object
      required: [id, method, url]
      properties:
        id:
          $ref: "#/components/schemas/FileIdentifier"
        method:
          type: string
          default: PUT
          enum:
            - POST
            - PUT
          example: PUT
        url:
          type: string
          format: uri
          example: http://example/com/upload

    Metadata:
      type: object
      properties:
        total:
          type: number
          description: >
            Returned in a paginated result set.  Indicates the total number of records in the given result set.
          example: 1

    SortDirection:
      type: string
      enum: ["asc", "desc"]

    Limit:
      type: integer
      minimum: 0

    Offset:
      type: integer
      minimum: 0

    DateTimeFilter:
      type: object
      description: >
        A filter used to filter results based on a given `date-time` field.

        Specific filters allow the client to search between a starting and ending date-time range, before a given date-time, at a specific
        date-time, and after a given date-time.

        Relative filters allow the client to search the past X chrono units (e.g. past 30 days), the next X chrono units (e.g. the next 7
        days), or within the current chrono unit (e.g. in the current month or year).
      properties:
        # Specific date-time filters.
        between:
          $ref: "#/components/schemas/DateTimeRange"
        before:
          type: string
          format: date-time
        at:
          type: string
          format: date-time
        after:
          type: string
          format: date-time
        # Relative date-time filters.
        past:
          $ref: "#/components/schemas/RelativeRange"
        next:
          $ref: "#/components/schemas/RelativeRange"
        current:
          $ref: "#/components/schemas/ChronoUnit"
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      example:
        next:
          duration: 1
          unit: week

    DateTimeRange:
      type: object
      description: >
        A fixed date-time range, represented by a start date-time and an end date-time.
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    RelativeRange:
      type: object
      description: >
        A relative range.  Used to represent a range of date/time values relative to the current date and time.
      required:
        - duration
        - unit
      properties:
        duration:
          type: integer
          description: >
            The number of chronological units to include in the range.  For example the next 30 days would have `duration: 30` and `unit:
            day`
        unit:
          $ref: "#/components/schemas/ChronoUnit"
        inclusive:
          type: boolean
          default: true
          description: >
            A flag to indicate if the relative range should commmence relative to the current date-time, or if it should start on the next
            logical chronological boundary. For example, next month, could be the next 30-ish days starting from now (inclusive: true) or it
            could be the full range of days in the next month, starting on the first of the month

    ChronoUnit:
      type: string
      description: >
        A standard set of date periods units. This set of units provide unit-based access to manipulate a date, time or date-time.
      enum:
        - day
        - week
        - month
        - year

    ValueType:
      description: The data type of the values
      type: object
      required:
        - "type"
      properties:
        type:
          type: string
          enum:
            - string
            - integer
            - number
            - boolean
            - object
            - array
        format:
          type: string
        items:
          $ref: "#/components/schemas/ValueType"
        properties:
          additionalProperties:
            $ref: "#/components/schemas/ValueType"

    ColumnType:
      description: >
        The role of the column in the results
          * attribute: column from a simple projection
          * dimension: column from an aggregation query used in the 'group by' clause
          * measure: column aggregated in an aggregation query
          * constant: a constant value
          * document: column with the full JSON payload of the record
      type: string
      enum:
        - attribute
        - dimension
        - measure
        - constant
        - document
    QueryResponseColumn:
      type: object
      properties:
        name:
          description: The name of the column
          type: string
          example: client.ip
        columnType:
          $ref: "#/components/schemas/ColumnType"
        dataType:
          $ref: "#/components/schemas/ValueType"
        sortable:
          description: Whether the column is sortable
          type: boolean
      required:
        - name
        - columnType
        - dataType
        - sortable
    QueryResponseInterval:
      description: The time interval used to query the backend database
      type: object
      properties:
        start:
          description: The start of the time interval (inclusive)
          type: string
          format: date-time
        end:
          description: The end of the time interval (exclusive)
          type: string
          format: date-time
      example:
        start: 2021-01-01T12:34:56
        end: 2021-01-01T18:34:56
    QueryMetadata:
      type: object
      required:
        - columns
        - offset
      properties:
        total:
          description: Total number of records in the results
          type: integer
          format: int64
          minimum: 0
          example: 123456
        offset:
          description: Offset to use to get the next page of results
          type: integer
          format: int32
          minimum: -1
          example: 100
        columns:
          description: Metadata about the columns in the response
          type: array
          items:
            $ref: "#/components/schemas/QueryResponseColumn"

    ExecuteQueryResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApiStatus"
        metadata:
          $ref: "#/components/schemas/QueryMetadata"
        data:
          description: Results as an array of rows, each with an array of values
          type: array
          items:
            type: array
            items: {}

    # ##################################################################################################################
    # Failure Mode Domain Objects
    # ##################################################################################################################
    FieldError:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
        path:
          type: string

    APIError:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApiStatus"
        data:
          type: object
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
